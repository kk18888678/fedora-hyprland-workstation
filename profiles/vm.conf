# Fedora Hyprland Workstation
# VM validation profile

PROFILE_NAME="vm"

# Hardware
GPU="virtio"

# Desktop
DESKTOP="hyprland"
SHELL="zsh"
OH_MY_ZSH=true
PROMPT="starship"

# Applications
BROWSER_CHROMIUM=true
BROWSER_ULAA=true
BROWSER_BRAVE_ORIGIN=false
BROWSER_FIREFOX=false

# Features
BLUETOOTH=false
GAMING=false
FLATPAK=true
NIX=true
PODMAN=true

# Hardware-specific stacks
NVIDIA=false
ROCM=false

# Installation behaviour
ENABLE_GRAPHICAL_TARGET=true
INSTALL_GREETER=true
INSTALL_NOCTALIA=true
