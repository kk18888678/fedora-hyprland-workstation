# Fedora Hyprland Workstation
# VM validation profile

PROFILE_NAME="vm"

# Hardware
GPU="virtio"

# Desktop
DESKTOP="hyprland"
# The VM exercises the Aurelia post-login shell while keeping Noctalia as the
# independent greetd login screen.
DESKTOP_SHELL="aurelia"
SHELL="zsh"
OH_MY_ZSH=true
PROMPT="starship"

# Applications
BROWSER_CHROMIUM=true
BROWSER_ULAA=true
BROWSER_BRAVE_ORIGIN=true
BROWSER_FIREFOX=true
CURSOR=true
KATE=true
CHATGPT=true
MEDIA_APPLICATIONS=true
ANTIGRAVITY=true
LOCALSEND=false

# Features
BLUETOOTH=false
GAMING=false
FLATPAK=true
NIX=true
PODMAN=true

# Hardware-specific stacks
NVIDIA=false
ROCM=false

# Installation behaviour
ENABLE_GRAPHICAL_TARGET=true
INSTALL_GREETER=true
# Keep the Noctalia runtime installed for the Noctalia greetd greeter.
INSTALL_NOCTALIA=true
