# Fedora Hyprland Workstation
# VM validation profile

PROFILE_NAME="vm"

# Hardware
GPU="virtio"

# Desktop
DESKTOP="hyprland"
# Future shells (for example omarchy) are reserved; only noctalia is implemented.
DESKTOP_SHELL="noctalia"
SHELL="zsh"
OH_MY_ZSH=true
PROMPT="starship"

# Applications
BROWSER_CHROMIUM=true
BROWSER_ULAA=false
BROWSER_BRAVE_ORIGIN=true
BROWSER_FIREFOX=true
CURSOR=true

# Features
BLUETOOTH=false
GAMING=false
FLATPAK=true
NIX=true
PODMAN=true

# Hardware-specific stacks
NVIDIA=false
ROCM=false

# Installation behaviour
ENABLE_GRAPHICAL_TARGET=true
INSTALL_GREETER=true
INSTALL_NOCTALIA=true
