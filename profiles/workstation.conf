# Fedora Hyprland Workstation
# Physical workstation profile

PROFILE_NAME="workstation"

# Hardware
GPU="generic"

# Desktop
DESKTOP="hyprland"
# Noctalia remains the stable post-login shell for the physical workstation.
DESKTOP_SHELL="noctalia"
SHELL="zsh"
OH_MY_ZSH=true
PROMPT="starship"

# Applications
BROWSER_CHROMIUM=true
BROWSER_ULAA=true
BROWSER_BRAVE_ORIGIN=true
BROWSER_FIREFOX=true
CURSOR=true
KATE=true
CHATGPT=true
MEDIA_APPLICATIONS=true
ANTIGRAVITY=true
LOCALSEND=false

# Features
BLUETOOTH=true
GAMING=false
FLATPAK=true
NIX=true
PODMAN=true

# Hardware-specific stacks
NVIDIA=false
ROCM=false

# Installation behaviour
ENABLE_GRAPHICAL_TARGET=true
INSTALL_GREETER=true
# Noctalia provides both the session shell and the greetd greeter here.
INSTALL_NOCTALIA=true
