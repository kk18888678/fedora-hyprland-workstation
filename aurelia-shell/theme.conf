# Aurelia Workstation Design System Configuration
# =================================================
# Single source of truth for all Aurelia components (Keybindings, etc.).
# Modifying variables in this file dynamically updates colors, geometry, dimensions,
# table column widths, spacing scale, typography, and motion across all components.

# ==============================================================================
# 1. WINDOW GEOMETRY & LAYOUT DIMENSIONS
# ==============================================================================
# Main command palette window dimensions (compact command-palette target)
paletteWidth = 560
paletteHeight = 420

# Component element vertical dimensions (px)
searchHeight = 36
rowHeight = 34
footerHeight = 34

# Table column layout & spacing
# colShortcutWidth: width allocated for the Shortcut column (Column 1).
# 350px provides a balanced 50/50 proportional split with centered separator arrow.
# 280px provides an ~40/60 split with more room for verbose action descriptions.
colShortcutWidth = 350
colSeparatorWidth = 28
rowSpacing = 3
scrollBarWidth = 4

# Corner radii (px)
radiusSm = 4
radiusMd = 8
radiusLg = 12

# Border widths (px)
borderWidthDefault = 1
borderWidthFocus = 2

# ==============================================================================
# 2. SPACING SCALE (px)
# ==============================================================================
spacingXs = 4
spacingSm = 8
spacingMd = 12
spacingLg = 16
spacingXl = 20
spacingXxl = 24

# Compact menu geometry. These values keep short bar-owned surfaces dense
# without changing the spacing scale used by larger settings panels.
popupPadding = 10
popupRowGap = 2
popupSeparatorHeight = 6
trayMenuPadding = 8
trayMenuRowHeight = 30
trayMenuGap = 1
trayMenuSeparatorHeight = 4
trayMenuSectionHeight = 22
trayMenuTextSize = 12
trayMenuSectionTextSize = 10
trayMenuTextInset = 28

# ==============================================================================
# 2a. BAR GEOMETRY (Omarchy-compatible structural defaults)
# ==============================================================================
# Dimensions are measured at fontBaseSize 12 and scale with fontBaseSize.
barScaleWithFont = true
barSizeHorizontal = 26
barSizeVertical = 28
barIconSlot = 27
barIconCanvas = 16
barIconFont = 13
barStatusSlot = 21
barOuterMargin = 8
barTrayIcon = 12
barWorkspaceWidth = 20
barTextMargin = 8.75
barTextSize = 12
barCaptionSize = 10

# ==============================================================================
# 2b. MINIMAL CALENDAR SURFACE
# ==============================================================================
# The calendar is intentionally smaller and flatter than the command palette.
calendarPopupWidth = 320
calendarPopupHeight = 386
calendarPadding = 12
calendarCellSize = 36
calendarCellGap = 2
calendarHeaderHeight = 26
calendarToolbarHeight = 30
calendarWeekdayHeight = 16
calendarFooterHeight = 12

# ==============================================================================
# 3. TYPOGRAPHY
# ==============================================================================
fontFamily = JetBrainsMono Nerd Font, Hack Nerd Font, monospace
fontFamilyProse = sans-serif
fontSizeXs = 10
fontSizeSm = 13
fontSizeMd = 14
fontSizeLg = 15
fontSizeXl = 18

# ==============================================================================
# 4. MOTION & ANIMATION TIMING (ms)
# ==============================================================================
durationFast = 100
durationNormal = 200

# ==============================================================================
# 5. COLOR SCHEME (Rosé Pine Moon Palette & Theme Tokens)
# ==============================================================================
# Base surfaces & backgrounds
background = #232136
surface = #2a273f
surfaceElevated = #393552
selection = #393552
selectionHover = #393552
selectionActive = #44415a

# Borders (borderActive dynamically highlights focused or hovered surface)
border = #424659
borderActive = #9ccfd8

# Text hierarchy
text = #e0def4
textSecondary = #908caa
textMuted = #6e6a86
textSubtle = #6e6a86

# Semantic accent colors
accent = #9ccfd8
accentAlt = #c4a7e7
gold = #f6c177
love = #eb6f92
pine = #3e8fb0
foam = #9ccfd8
rose = #ea9a97
iris = #c4a7e7

# Status & feedback colors
success = #9ccfd8
warning = #f6c177
error = #eb6f92

# Calendar-only semantic colors. Change these to create a distinct calendar
# treatment without changing the rest of the Aurelia shell.
calendarAccent = #9ccfd8
calendarHover = #393552
calendarWeekend = #908caa
calendarAdjacent = #6e6a86
calendarRule = #424659
