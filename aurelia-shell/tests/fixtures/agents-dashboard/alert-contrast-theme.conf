# Pinned fixture theme for the measured alert-contrast render.
#
# It exists so the measured-render assertion does NOT depend on the shipped or
# wallpaper-generated theme files (owned by a separate palette task). The
# error token below is the shipped Aurelia Rose Pine Moon value and measures
# 5.38:1 against #232136, so the assertion is valid independently of any
# palette work: the render must show this token at FULL opacity, never a dimmed
# composite.
background = #232136
surface = #2a273f
text = #e0def4
muted = #908caa
accent = #9ccfd8
error = #eb6f92
warning = #f6c177
