# Declarative Prerelease Exceptions Registry
#
# Policy:
# - Prerelease software is prohibited by default.
# - A narrowly scoped declarative exception may permit explicitly named
#   prerelease classes for an explicitly named application.
# - Exceptions affect release eligibility only and MUST NOT weaken provenance,
#   integrity, archive, installation, or validation requirements.
# - A policy-compliant stable release always takes precedence over an allowed prerelease.
# - Unknown prerelease classes fail closed. Wildcards are prohibited.

[n_m3u8dl_re]
enabled = true
allowed_classes = beta
selection_policy = stable_then_allowed_prerelease
reason = "Upstream nilaoda/N_m3u8DL-RE distributes the supported release line exclusively with -beta suffix; no stable release has ever been published."
