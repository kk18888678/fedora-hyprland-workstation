# Fedora workstation package-manager defaults.
#
# This file is parsed as data, not sourced as shell. A user override may be
# placed at ~/.config/workstation/package-manager.conf. Changes affect new
# package-manager processes; they never alter the tracked package manifest.

# Catalog/cache policy.
catalog_stale_seconds=21600
catalog_boot_delay=45s
catalog_refresh_interval=6h
catalog_refresh_jitter=5m
catalog_result_limit=250

# Bounded external operations.
dnf_metadata_timeout=240
dnf_resolve_timeout=30
flatpak_metadata_timeout=180
transaction_timeout=1800
lock_wait_seconds=15

# Interactive key commands. Values use fzf key names.
key_up=up
key_down=down
key_page_up=pgup
key_page_down=pgdn
key_select=tab
key_accept=enter
key_cancel=esc
key_refresh=ctrl-r
key_help=?
key_preview_toggle=alt-p
key_preview_up=alt-k
key_preview_down=alt-j
key_select_all=ctrl-a
key_search=/
key_queue=a
key_source=s
key_info=i
key_versions=v
key_add_source=+
key_quit=q
key_filter_next=right
key_filter_previous=left
key_sort=o
key_sort_reverse=O

# TUI dimensions. Keep the UI compact while allowing wide metadata previews.
tui_preview_window=down:40%:wrap
tui_height=100%
tui_color=fg:#cdd6f4,bg:#1e1e2e,fg+:#f5e0e6,bg+:#313244,hl:#f38ba8,hl+:#f38ba8,pointer:#89b4fa,marker:#a6e3a1,info:#89b4fa,prompt:#89b4fa,spinner:#f9e2af,header:#f5c2e7:bold,footer:#89dceb,label:#cba6f7,border:#89b4fa
tui_border=rounded
tui_margin=1,2
tui_padding=0,1
tui_info=inline-right
tui_scroll_off=0
tui_tabstop=2
tui_title="Package Manager"
tui_header_label="Catalog"
tui_input_label="Search"
tui_list_label="Packages"
tui_preview_label="Selected package · metadata"
tui_footer_label="Keys"
tui_prompt="Search > "
tui_pointer=▌
tui_marker=┃
